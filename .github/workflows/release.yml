name: Release

on:
  # Every push to main cuts a release. Doc-only pushes are skipped so that writing
  # up a finding does not ship an APK identical to the last one.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
    tags:
      - "v*"
  # So a release can still be cut by hand without an empty commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # action-gh-release's generated notes diff against the previous tag, which
          # needs the tag history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same debug-keystore rationale as ci.yml: there's no release signing key in
      # CI, so releases ship the debug-signed build (installable, just not eligible
      # for a Play Store upload under this identity).
      #
      # If RELEASE_KEYSTORE_BASE64 is set as a repository secret it is used instead,
      # which is what makes consecutive releases upgrade in place — see the note in
      # docs/releases.md about why a freshly generated keystore does not.
      - name: Restore or generate keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Using the keystore from RELEASE_KEYSTORE_BASE64."
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret; generated a throwaway keystore. This APK will not install over a previous release without uninstalling first."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # A release that fails its own tests is worse than no release. ci.yml also runs
      # these on main; the duplicate run is the price of not publishing a broken APK.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # A tag push releases under that tag. A main push derives one from the app's
      # versionName plus the run number, so tags stay unique and ordered without
      # anyone having to remember to bump anything.
      - name: Work out the release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
            if [ -z "$VERSION_NAME" ]; then
              echo "Could not read versionName from app/build.gradle.kts" >&2
              exit 1
            fi
            echo "name=v${VERSION_NAME}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk fuse-${{ steps.tag.outputs.name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: fuse-${{ steps.tag.outputs.name }}.apk
          generate_release_notes: true
